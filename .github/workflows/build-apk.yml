name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with PWABuilder
        uses: pwa-builder/pwa-to-apk@v1
        with:
          url: https://salaamajuniorsch-ux.github.io/Salaama-School-v2-App/
          packageId: com.salaama.school
          appName: Salaama School
          themeColor: "#0a2a8a"
          backgroundColor: "#ffffff"
          display: standalone
          orientation: portrait

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salaama-School-APK
          path: "*.apk"
