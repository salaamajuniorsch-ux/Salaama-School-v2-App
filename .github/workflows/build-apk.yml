name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA Project
        run: |
          mkdir -p twa
          cd twa
          bubblewrap init --manifest https://salaamajuniorsch-ux.github.io/Salaama-School-v2-App/manifest.json --directory . --packageId com.salaama.school --name "Salaama School" --display standalone --themeColor "#0a2a8a" --backgroundColor "#ffffff" --orientation portrait --enableNotifications --skipPwaValidation || true
          echo "jdkPath=${JAVA_HOME}" >> twa-manifest.json || true
          cat twa-manifest.json || cat bubblewrap.json || ls -la

      - name: Build APK
        run: |
          cd twa
          bubblewrap build --skipPwaValidation || bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salaama-School-APK
          path: twa/app/build/outputs/**/*.apk
