<style>
:root{--blue:#2E42C2;--gold:#F2C94C;--green:#2E9E4F;--bg:#F8F9FF}
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:var(--bg);color:#222}
.screen{display:none;min-height:100vh}.screen.active{display:block}

.btn-gold{background:var(--gold);color:#222}.btn-green{background:var(--green)}.btn-red{background:#E53935}.btn:disabled{opacity:.6}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;margin-top:8px}
.statGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.stat{border-radius:12px;padding:10px;text-align:center;color:#fff;background:var(--blue)}.stat:nth-child(2){background:var(--green)}.stat:nth-child(3){background:var(--gold);color:#222}.stat b{font-size:15px;display:block}
.badge-green{background:#2E9E4F;color:#fff;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold}.badge-orange{background:#FF9800;color:#fff;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold}.badge-grey{background:#eee;color:#666;padding:3px 8px;border-radius:10px;font-size:11px}
.hidden{display:none}.row{display:flex;gap:6px}.row>*{flex:1}
.tick{width:28px;height:28px;border:2px solid #2E42C2;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer}.tick.on{background:#2E9E4F;color:#fff;border-color:#2E9E4F}
.bar{height:18px;background:#EEF1FF;border-radius:99px;overflow:hidden;margin:6px 0}.bar>div{height:100%;background:var(--blue)}.bar.green>div{background:var(--green)}.bar.red>div{background:#E53935}
#splash{position:fixed;inset:0;z-index:999;background:linear-gradient(180deg,#0A2AA8,#081E7A);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
#splash img{width:150px;height:150px;background:#fff;border-radius:50%;padding:10px}
#aiBtn{position:fixed;right:14px;bottom:16px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#2E42C2,#6A3DFF);color:#fff;border:3px solid var(--gold);z-index:100;cursor:pointer}
@media print{body *{visibility:hidden}.printArea,.printArea *{visibility:visible}.printArea{position:absolute;left:0;top:0;width:100%}}
</style>

let auth=null,db=null,firebaseReady=false,currentUid=null,cur='admin',userName='User',userContact='',selected=[],approvedRoles=[],authHandled=false,isDeveloper=false,isAdminUser=false,adminNo='',appSettings={allowDeleteStudents:false,allowDeleteTeachers:false,allowPNG:true,allowPDF:true,allowDOCX:true,allowTheologySettings:false,allowCustomTheology:false,allowBothDates:false,allowEngArabic:false,termBegin:'',termEnd:'',requirements:[],feesTypes:[{name:'School Fees',amount:0},{name:'Admission Fee',amount:0},{name:'Vocational Skilling',amount:0}],subjectsSec:['English','Math','Science','SST'],subjectsTheo:['Quran','Arabic','Islamic Studies']};
let allStudents=[],allUsers=[],allFees=[],allExpenses=[];

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function goDash(){show('scr-dash')} function goRoles(){renderRoleList();show('scr-role')}
function setMsg(t,c){let m=document.getElementById('loginMsg');if(m){m.style.color=c||'#E53935';m.innerText=t}}
function cleanPhone(p){p=(p||'').replace(/[^0-9+]/g,'');if(p.startsWith('0'))p='256'+p.slice(1);if(p.startsWith('+'))p=p.slice(1);return p}
function makeStudentId(){return 'SAL-'+new Date().getFullYear()+'-'+Math.floor(100+Math.random()*900)}
function isDevEmail(e){return (e||'').toLowerCase().trim()===DEV_EMAIL}
function isAdminEmail(e){return (e||'').toLowerCase().trim()===ADMIN_EMAIL}

// --- INIT ---
try{if(typeof firebase!=='undefined'){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();firebaseReady=true;let s=document.getElementById('fbStatus');if(s){s.style.background='#E8F5E9';s.style.borderColor='#2E9E4F';s.innerText='Connected - New Project';}
auth.onAuthStateChanged(async(u)=>{if(u&&!authHandled){authHandled=true;await handleAfterAuth(u.email)}else if(!u){authHandled=false}})}}catch(e){let s=document.getElementById('fbStatus');if(s)s.innerText='Connect - Error: '+e.message}}

async function ensureCollections(){if(!db)return;for(let c of ['users','students','staff','fees','attendance','results','notices','tahfiizu','classes','documents','messages','expenses','timetables','exams','curriculum','history','settings']){try{let s=await db.collection(c).limit(1).get();if(s.empty)await db.collection(c).doc('_init').set({_init:true,createdAt:new Date()})}catch(e){}}}
async function loadSettings(){try{let d=await db.collection('settings').doc('main').get();if(d.exists)appSettings={...appSettings,...d.data()}}catch(e){}return appSettings}
async function saveSettingsDoc(){await db.collection('settings').doc('main').set(appSettings);await loadSettings()}

async function ensureUserDoc(uid,email,name,contact,adminNoVal){
  let ref=db.collection('users').doc(uid);let doc=await ref.get();let isDev=isDevEmail(email);let isAdmin=isAdminEmail(email);
  if(!doc.exists){
    let roles=isDev?ROLES.map(r=>r.id):[];
    let d={name:name||email.split('@')[0],email,contact:contact||'',adminNo:adminNoVal||'',roles,approvedRoles:roles,approved:isDev?true:false,isDeveloper:isDev,isAdmin:isAdmin,status:isDev?'approved':'pending',createdAt:new Date()};
    await ref.set(d);return d;
  }
  let d=doc.data(); if(isDev&&!d.isDeveloper)await ref.update({isDeveloper:true,approved:true,approvedRoles:ROLES.map(r=>r.id),roles:ROLES.map(r=>r.id)}); return {...d,...(isDev?{isDeveloper:true,approved:true}:{})};
}
async function handleAfterAuth(email){
  if(!auth.currentUser)return;currentUid=auth.currentUser.uid;await ensureCollections();await loadSettings();
  let nameInput=document.getElementById('f-name').value.trim();let contactInput=document.getElementById('f-contact').value.trim();let adminNoInput=document.getElementById('f-adminNo').value.trim();
  // ADMIN LIMIT: Max 4 admins - check count
  if(isAdminEmail(email)&&adminNoInput){
    let snap=await db.collection('users').where('email','==',ADMIN_EMAIL).where('approved','==',true).get();
    let nums=new Set();snap.forEach(d=>{if(d.data().adminNo)nums.add(d.data().adminNo)});let myDoc=await db.collection('users').doc(currentUid).get();
    if(!myDoc.exists&&nums.size>=4&&!nums.has(adminNoInput)){alert('Max 4 Admins reached. Cannot add more.');auth.signOut();return;}
    if(!['001','002','003','004'].includes(adminNoInput)){alert('Admin No must be 001 - 004');auth.signOut();return;}
  }
  let d=await ensureUserDoc(currentUid,email,nameInput,contactInput,adminNoInput);userName=d.name||email;userContact=d.contact||contactInput;isDeveloper=d.isDeveloper===true||isDevEmail(email);isAdminUser=d.isAdmin===true||isAdminEmail(email);adminNo=d.adminNo||adminNoInput;
  document.getElementById('roleUserName').innerText=userName;setMsg('','#2E9E4F');
  if(isDeveloper){approvedRoles=ROLES.map(r=>r.id);selected=[...approvedRoles];renderRoleList();show('scr-role');return}
  if(isAdminUser&&d.approved!==true){
    // Admin self-approves if slot free, else wait - first admin approves others
    let snap=await db.collection('users').where('isAdmin','==',true).where('approved','==',true).get();let count=0;snap.forEach(()=>count++);
    if(count<4){await db.collection('users').doc(currentUid).update({approved:true,approvedRoles:['admin'],roles:['admin'],status:'approved'});approvedRoles=['admin'];selected=['admin'];renderRoleList();show('scr-role');return;}
  }
  if(d.approved!==true){selected=d.roles||[];approvedRoles=[];document.getElementById('waitRoles').innerText='Selected: '+(selected.join(', ')||'none')+' - Waiting Admin';show('scr-wait');renderRoleList();return}
  approvedRoles=d.approvedRoles||d.roles||[];selected=[...approvedRoles];renderRoleList();show('scr-role');
}
async function firebaseSignup(){let email=document.getElementById('f-email').value.trim().toLowerCase(),pass=document.getElementById('f-pass').value,name=document.getElementById('f-name').value.trim(),contact=document.getElementById('f-contact').value.trim();if(!name){setMsg('Enter Full Name');return}if(!email||!pass){setMsg('Enter Email and Password');return}if(pass.length<6){setMsg('Password 6+');return}if(!firebaseReady){setMsg('Not Connected - Check Firebase Config');return}setMsg('Creating...','#2E42C2');try{authHandled=false;await auth.createUserWithEmailAndPassword(email,pass);authHandled=true;await handleAfterAuth(email)}catch(e){if(e.code==='auth/email-already-in-use'){setMsg('Exists. Logging in...','#2E9E4F');try{authHandled=false;await auth.signInWithEmailAndPassword(email,pass);authHandled=true;await handleAfterAuth(email)}catch(e2){setMsg('Wrong password. Forgot Password?')}}else setMsg(e.message)}}
async function firebaseLogin(){let email=document.getElementById('f-email').value.trim().toLowerCase(),pass=document.getElementById('f-pass').value;if(!email||!pass){setMsg('Enter Email and Password');return}if(!firebaseReady){setMsg('Not Connected');return}authHandled=false;setMsg('Logging in...','#2E42C2');try{if(auth.currentUser&&auth.currentUser.email===email){authHandled=true;await handleAfterAuth(email);return}await auth.signInWithEmailAndPassword(email,pass);authHandled=true;await handleAfterAuth(email)}catch(e){setMsg(e.message)}}
async function forgotPassword(){let email=document.getElementById('f-email').value.trim().toLowerCase();if(!email){setMsg('Enter Email');return}try{await auth.sendPasswordResetEmail(email);setMsg('Reset sent to '+email,'#2E9E4F')}catch(e){setMsg(e.message)}}
async function checkApproval(){if(!currentUid&&auth.currentUser)currentUid=auth.currentUser.uid;let doc=await db.collection('users').doc(currentUid).get();let d=doc.data();if(d.approved===true){approvedRoles=d.approvedRoles||[];selected=[...approvedRoles];renderRoleList();show('scr-role')}else alert('Still pending')}
function logout(){if(confirm('Logout?')){authHandled=false;if(auth)auth.signOut();show('scr-login')}}
function renderRoleList(){document.getElementById('roleList').innerHTML=ROLES.map(r=>{let isSel=selected.includes(r.id);let isApp=approvedRoles.includes(r.id);let cls=isApp?'approved':(isSel?'pending':'');let badge=isApp?'<span class="badge-green">APPROVED - Tap to Enter</span>':(isSel?'<span class="badge-orange">PENDING</span>':'<span class="badge-grey">Tap to Select</span>');return `<div class="card" style="border:2px solid ${isApp?'#2E9E4F':isSel?'#FF9800':'#eee'};cursor:pointer" onclick="toggleRoleCard('${r.id}')"><b>${r.icon} ${r.name}</b><p>${r.desc}</p>${badge}</div>`}).join('')}
function toggleRoleCard(id){if(approvedRoles.includes(id)){cur=id;switchRole(id);show('scr-dash');loadDashboard();return}if(selected.includes(id)){selected=selected.filter(x=>x!==id);renderRoleList();return}let max=isDeveloper?10:(id==='admin'||selected.includes('admin')?4:3);if(selected.length>=max){alert('Max '+max+' roles');return}selected.push(id);renderRoleList()}
function confirmRoles(){if(!selected.length){alert('Select role');return}if(!approvedRoles.length){alert('Not approved yet');return}let toEnter=selected.find(r=>approvedRoles.includes(r))||approvedRoles[0];cur=toEnter;switchRole(cur);show('scr-dash');loadDashboard()}
async function saveRolesToFirebase(){if(!selected.length){alert('Select 1 role');return}try{let doc=await db.collection('users').doc(currentUid).get();let isDev=doc.data().isDeveloper;if(isDev){await db.collection('users').doc(currentUid).update({roles:selected,approvedRoles:selected,approved:true});approvedRoles=[...selected];renderRoleList();show('scr-role');return}await db.collection('users').doc(currentUid).update({roles:selected,approvedRoles:[],approved:false,status:'pending'});approvedRoles=[];alert('Saved. Waiting Admin.');show('scr-wait')}catch(e){alert(e.message)}}

// --- DASHBOARDS ---

if(cur==='admin')return [['👥','Staff Management','Approvals + Staff'],['🧒','Students Management','Register + List'],['🏫','Classes','All classes'],['✅','Attendance','All attendance'],['📖','Tahfiizu','Hifzu view'],['💰','Finance','Income + Expense + Graph'],['💸','Expenses','Add expenses'],['📄','Documents','My documents'],['💬','Messages','Chat users'],['🎬','Media','Videos + Audios'],['📜','History','Old terms'],['⚙️','Settings','Term, fees, permissions'],['👑','Admin','Add Roles']];
if(cur==='headteacher')return [['👨‍🏫','Teacher Management','Staff + responsibilities'],['🏫','Classes','Secular + Theo + Tahfiizu'],['📝','Exams Approval','Approve exams'],['✅','Attendance','All'],['📊','Children Performance','Results'],['📄','Report Card','Generate'],['🗓️','Timetable','From DOS'],['📄','Documents','My docs'],['💬','Messages','Chat']];
if(cur==='bursar')return [['💰','Collect Fees','Tap student'],['🧾','Generate Receipt','Receipt + Demand'],['🧒','Students & Fee Status','Fees per class'],['📊','Cashflow','Income + Graph'],['📄','Documents','My docs'],['💬','Messages','Chat']];
if(cur==='dos_sec')return [['✅','Secular Attendance','From teachers'],['📈','Children Performance','Results'],['👨‍🏫','Teacher Performance','Give marks'],['📚','Secular Curriculum','Type + save'],['📝','Exams Approval','Approve'],['📄','Documents','My docs'],['💬','Messages','Chat']];

if(cur==='tahfiizu')return [['🧒','Students List','Tahfiizu students'],['✅','Attendance','Tap name'],['📖','Quran Presentation','Darsu / Sitta / Omuraaji'],['🏆','Hifzu Certificate','Tap name'],['📄','Documents','My docs'],['💬','Messages','Chat']];
if(cur==='other')return [['✅','My Attendance','Mark self'],['💬','Messages','Chat'],['📄','Documents','My docs']];
if(cur==='parent')return [['🧒','My Child Profile','My children'],['💰','Fees Status','Fees'],['✅','Attendance','Attendance'],['📊','Results','Results'],['📖','Tahfiizu Progress','If Tahfiizu'],['🗓️','Timetable','Class timetable'],['📄','Documents','My docs'],['💬','Messages','Chat Admin']];

}
function switchRole(r){cur=r;let R=ROLES.find(x=>x.id==r);if(!R)return;if(firebaseReady&&currentUid)db.collection('users').doc(currentUid).update({lastRole:r}).catch(()=>{});document.getElementById('curRoleName').innerText=R.name;document.getElementById('dashRoleLabel').innerText=R.name;document.getElementById('dashUserName').innerText=userName;let items=getDash();document.getElementById('dashGrid').innerHTML=items.map(i=>`<div class="tile" onclick="openScreen('${i[1]}')"><div class="ic">${i[0]}</div><b>${i[1]}</b><span>${i[2]}</span></div>`).join('')}
async function loadDashboard(){
try{await loadSettings();let sSnap=await db.collection('students').get();allStudents=[];sSnap.forEach(d=>{if(!d.data()._init)allStudents.push({id:d.id,...d.data()})});
let fSnap=await db.collection('fees').get();let collected=0;fSnap.forEach(d=>{if(!d.data()._init)collected+=Number(d.data().amount||0)});

async function saveStudent(){let n=document.getElementById('st-name').value.trim();if(!n){alert('Enter Name');return}let sid=makeStudentId();let reqs=[...document.querySelectorAll('.st-req:checked')].map(c=>c.value);await db.collection('students').add({name:n,cls:document.getElementById('st-class').value,theoClass:document.getElementById('st-theoClass').value,isTahfiizu:document.getElementById('st-tahfiizu').checked,fatherName:document.getElementById('st-father').value,motherName:document.getElementById('st-mother').value,fatherPhone:document.getElementById('st-father-phone').value,motherPhone:document.getElementById('st-mother-phone').value,parentPhones:[document.getElementById('st-father-phone').value,document.getElementById('st-mother-phone').value].filter(x=>x),studentId:sid,fees:Number(document.getElementById('st-fees').value||0),paid:Number(document.getElementById('st-paid').value||0),admissionFee:Number(document.getElementById('st-admission').value||0),requirements:reqs,parentIds:[],createdAt:new Date()});alert('Saved! Child ID: '+sid+' - Give to parent');listStudents();loadDashboard()}
async function listStudents(){let s=await db.collection('students').get();let h='';s.forEach(d=>{let x=d.data();if(x._init)return;h+=`<div class="card" onclick="toggleExpand('${d.id}')"><b>${x.name}</b> - ${x.cls||''} ${x.isTahfiizu?'📖 Tahfiizu':''} - ID ${x.studentId||''}<br>Fees ${x.fees} | Paid ${x.paid} | Bal ${(x.fees||0)-(x.paid||0)}<br><div id="exp-${d.id}" class="hidden">Father: ${x.fatherName||''} ${x.fatherPhone||''}<br>Mother: ${x.motherName||''} ${x.motherPhone||''}<br>Admission ${x.admissionFee||0}<br>Requirements: ${(x.requirements||[]).join(', ')}<br><button class="btn btn-green" onclick="sendWhatsAppTo('${x.fatherPhone||''}','${x.name}')">WhatsApp Father</button><button class="btn" onclick="sendWhatsAppTo('${x.motherPhone||''}','${x.name}')">WhatsApp Mother</button>${appSettings.allowDeleteStudents?`<button class="btn btn-red" onclick="deleteStudent('${d.id}','${x.name}')">Delete</button>`:''}</div></div>`});document.getElementById('listBox').innerHTML=h||'No students yet.'}
function toggleExpand(id){document.getElementById('exp-'+id).classList.toggle('hidden')}
async function deleteStudent(id,name){if(!appSettings.allowDeleteStudents){alert('Delete OFF in Settings');return}if(!confirm('Delete '+name+'?'))return;await db.collection('students').doc(id).delete();listStudents()}
function sendWhatsAppTo(phone,name){if(!phone){alert('No phone');return}window.open('https://wa.me/'+cleanPhone(phone)+'?text='+encodeURIComponent('SALAAMA about '+name),'_blank')}
async function linkParentById(){let sid=(document.getElementById('link-student-id').value||'').trim().toUpperCase();if(!sid){alert('Enter ID');return}let s=await db.collection('students').where('studentId','==',sid).get();if(s.empty){alert('No student '+sid);return}let docId='';let data=null;s.forEach(d=>{docId=d.id;data=d.data()});await db.collection('students').doc(docId).update({parentIds:firebase.firestore.FieldValue.arrayUnion(currentUid)});alert('Linked: '+data.name);listMyChildrenDetail('My Child Profile')}
async function listClasses(){let map={};allStudents.forEach(s=>{let c=s.cls||'No Class';map[c]=(map[c]||0)+1});let h='';for(let k in map)h+=`<div class="card"><b>${k}</b> - ${map[k]} students<br>${allStudents.filter(s=>s.cls===k).map(s=>s.name).join(', ')}</div>`;if(appSettings.allowCustomTheology){h+=`<h3>Theology Classes</h3>`;let tmap={};allStudents.forEach(s=>{if(s.theoClass){tmap[s.theoClass]=(tmap[s.theoClass]||0)+1}});for(let k in tmap)h+=`<div class="card"><b>${k} (Theo)</b> - ${tmap[k]}</div>`}let tah=allStudents.filter(s=>s.isTahfiizu);h+=`<h3>Tahfiizu - ${tah.length}</h3>${tah.map(s=>`<div class="card">${s.name} - ${s.cls}</div>`).join('')}`;document.getElementById('listBox').innerHTML=h||'No classes'}

async function loadPendingUsers(){let el=document.getElementById('pendingList');if(!el)return;try{let snap=await db.collection('users').where('approved','==',false).get();if(snap.empty){el.innerHTML='No pending users.';return}let html='';snap.forEach(doc=>{let u=doc.data();if(isDevEmail(u.email))return;html+=`<div class="card"><b>${u.name||u.email}</b><br>${u.email}<br>Contact: ${u.contact||''}<br>Requested: ${(u.roles||[]).join(', ')}<br><label>Give Roles 1-3:</label><br>${ROLES.map(r=>`<label style="font-size:12px"><input type="checkbox" class="ap-role-${doc.id}" value="${r.id}" style="width:auto"> ${r.name}</label><br>`).join('')}<input id="ap-ct-${doc.id}" placeholder="My Class e.g. P2"><input id="ap-subj-${doc.id}" placeholder="Subjects e.g. English, Math"><input id="ap-other-${doc.id}" placeholder="Other Classes e.g. P1,P3"><input id="ap-otherSubj-${doc.id}" placeholder="Subjects for Other Classes"><input id="ap-salary-${doc.id}" type="number" placeholder="Salary"><button class="btn btn-green" onclick="approveUserWithAssignment('${doc.id}')">Approve</button><button class="btn btn-red" onclick="rejectUser('${doc.id}')">Reject</button></div>`});el.innerHTML=html||'No pending'}catch(e){el.innerHTML='Error '+e.message}}
async function approveUserWithAssignment(uid){let checked=[...document.querySelectorAll('.ap-role-'+uid+':checked')].map(c=>c.value);if(!checked.length){alert('Tick 1-3 roles');return}if(checked.length>3){alert('Max 3');return}let ct=document.getElementById('ap-ct-'+uid).value;let subj=document.getElementById('ap-subj-'+uid).value.split(',').map(s=>s.trim()).filter(s=>s);let other=document.getElementById('ap-other-'+uid).value.split(',').map(s=>s.trim()).filter(s=>s);let otherSubj=document.getElementById('ap-otherSubj-'+uid).value.split(',').map(s=>s.trim()).filter(s=>s);let salary=Number(document.getElementById('ap-salary-'+uid).value||0);await db.collection('users').doc(uid).update({approved:true,approvedRoles:checked,roles:checked,myClass:ct,mySubjects:subj,otherClasses:other,otherSubjects:otherSubj,salary:salary,isClassTeacher:ct?true:false,classTeacherOf:ct,status:'approved'});alert('Approved: '+checked.join(','));loadPendingUsers();listStaffApproved()}
async function rejectUser(uid){if(!confirm('Reject?'))return;await db.collection('users').doc(uid).update({approved:false,approvedRoles:[],status:'rejected'});loadPendingUsers()}
async function listStaffApproved(){let el=document.getElementById('staffListBox');if(!el)return;let s=await db.collection('users').where('approved','==',true).get();let h='<h3>Staff List - Approved</h3>';s.forEach(d=>{let x=d.data();if(x._init||isDevEmail(x.email))return;h+=`<div class="card"><b>${x.name}</b> - ${x.email} - ${x.contact||''}<br>Roles: ${(x.approvedRoles||[]).join(', ')}<br>My Class: ${x.myClass||''} Subjects: ${(x.mySubjects||[]).join(', ')}<br>Other: ${(x.otherClasses||[]).join(', ')} Salary: ${x.salary||0}${appSettings.allowDeleteTeachers?`<br><button class="btn btn-red" onclick="deleteTeacher('${d.id}','${x.name}')">Delete Staff</button>`:''}</div>`});el.innerHTML=h}
async function deleteTeacher(id,name){if(!appSettings.allowDeleteTeachers){alert('Delete OFF');return}if(!confirm('Delete '+name))return;await db.collection('users').doc(id).delete();listStaffApproved()}
async function adminAddRoles(){let checked=[...document.querySelectorAll('.admin-role-add:checked')].map(c=>c.value);if(!checked.length){alert('Tick roles');return}if(checked.length>4){alert('Max 4 + Admin = 5');return}let childId=document.getElementById('admin-child-id').value.trim();if(checked.includes('parent')&&!childId){alert('Parent role needs Child ID - Register child first');return}let newRoles=['admin',...checked];if(childId){let s=await db.collection('students').where('studentId','==',childId.toUpperCase()).get();if(!s.empty){let did='';s.forEach(d=>did=d.id);await db.collection('students').doc(did).update({parentIds:firebase.firestore.FieldValue.arrayUnion(currentUid)})}}await db.collection('users').doc(currentUid).update({approvedRoles:newRoles,roles:newRoles});approvedRoles=newRoles;alert('Added: '+newRoles.join(','));renderRoleList()}

// --- FEES / EXPENSES / FINANCE ---
let selectedStudentId=null;
async function openCollectFee(id){selectedStudentId=id;let s=allStudents.find(x=>x.id===id);document.getElementById('collectBox').innerHTML=`<div class="card"><b>${s.name} - ${s.cls} - Bal ${((s.fees||0)-(s.paid||0)).toLocaleString()}</b><select id="collect-type">${appSettings.feesTypes.map(f=>`<option value="${f.name}">${f.name} - ${f.amount}</option>`).join('')}<option value="School Fees">School Fees</option><option value="Requirements">Requirements</option></select><input id="collect-amount" type="number" placeholder="Amount"><button class="btn btn-green" onclick="doCollectFee()">Record Payment</button></div>`}
async function doCollectFee(){let a=Number(document.getElementById('collect-amount').value||0);if(!a){alert('Enter Amount');return}let s=allStudents.find(x=>x.id===selectedStudentId);let type=document.getElementById('collect-type').value;await db.collection('fees').add({student:s.name,studentId:selectedStudentId,amount:a,type:type,date:new Date().toDateString(),createdAt:new Date(),by:userName});await db.collection('students').doc(selectedStudentId).update({paid:(s.paid||0)+a});alert('Saved '+a+' for '+s.name);loadDashboard()}
async function saveExpense(){let t=document.getElementById('ex-title').value;let a=Number(document.getElementById('ex-amount').value||0);if(!t||!a){alert('Enter Title + Amount');return}await db.collection('expenses').add({title:t,amount:a,by:userName,createdAt:new Date(),date:new Date().toDateString()});alert('Expense Saved');listExpenses()}
async function listExpenses(){let s=await db.collection('expenses').orderBy('createdAt','desc').limit(30).get();let h='';s.forEach(d=>{if(d.data()._init)return;h+=`<div class="card">${d.data().title} - ${d.data().amount} - ${d.data().date}</div>`});document.getElementById('listBox').innerHTML=h||'No expenses'}
async function showFinance(){let f=await db.collection('fees').get();let inc=0;f.forEach(d=>{if(!d.data()._init)inc+=Number(d.data().amount||0)});let e=await db.collection('expenses').get();let exp=0;e.forEach(d=>{if(!d.data()._init)exp+=Number(d.data().amount||0)});let sal=0;let u=await db.collection('users').get();u.forEach(d=>{if(!d.data()._init)sal+=Number(d.data().salary||0)});let totalExp=exp+sal;let max=Math.max(inc,totalExp,1);document.getElementById('listBox').innerHTML=`<div class="card"><b>Income (Fees+Requirements): ${inc.toLocaleString()}</b><div class="bar green"><div style="width:${inc/max*100}%"></div></div><b>Expenses (Salary ${sal.toLocaleString()} + Other ${exp.toLocaleString()} = ${totalExp.toLocaleString()})</b><div class="bar red"><div style="width:${totalExp/max*100}%"></div></div><b>Balance: ${(inc-totalExp).toLocaleString()}</b></div>`}
async function genReceipt(){}
async function genDemandReceipt(){alert('Demand Receipt: Select student, then it will be sent to Parent Dashboard as Document + Message')}
async function genCertificate(id){let s=allStudents.find(x=>x.id===id);let h=await db.collection('tahfiizu').where('studentId','==',id).orderBy('createdAt','desc').limit(5).get();let list='';h.forEach(d=>{list+=`${d.data().darsu||''} `});document.getElementById('certBox').innerHTML=`<div class="card printArea" style="text-align:center"><h2>HIFZU CERTIFICATE</h2><p>This certifies</p><h3>${s.name}</h3><p>Has completed Hifzu as recorded: ${list||'See Tahfiizu records'}</p><p>SALAAMA MUSLIM JUNIOR SCHOOL</p><button class="btn" onclick="window.print()">Print A4 Landscape</button></div>`}

// --- ATTENDANCE ---
async function listMarkAttendance(){let myDoc=await db.collection('users').doc(currentUid).get();let my=myDoc.data()||{};let cls=my.myClass||my.classTeacherOf||'';let list=allStudents.filter(s=>s.cls===cls);if(cur==='tahfiizu')list=allStudents.filter(s=>s.isTahfiizu);let h=list.map(s=>`<div class="card"><span class="tick" id="tick-${s.id}" onclick="toggleTick('${s.id}','${s.name}')">✓</span> <b>${s.name}</b> - ${s.cls}</div>`).join('')||'No students in your class '+cls;document.getElementById('listBox').innerHTML=h+`<button class="btn btn-green" onclick="saveMarkedAttendance()">Save Attendance for ${cls||'Tahfiizu'}</button>`}
let marked={};function toggleTick(id,name){let el=document.getElementById('tick-'+id);el.classList.toggle('on');marked[id]=el.classList.contains('on')?'Present':'Absent'}
async function saveMarkedAttendance(){for(let id in marked){let s=allStudents.find(x=>x.id===id);await db.collection('attendance').add({name:s.name,studentId:id,status:marked[id],date:new Date().toDateString(),createdAt:new Date(),by:userName,cls:s.cls})}alert('Attendance Saved');marked={}}
async function listAttendanceView(){let s=await db.collection('attendance').where('date','==',new Date().toDateString()).get();let h='';s.forEach(d=>{if(d.data()._init)return;h+=`<div class="card">${d.data().name} - ${d.data().status} - ${d.data().cls||''}</div>`});document.getElementById('listBox').innerHTML=h||'No attendance today'}
async function markSelfAttendance(){await db.collection('attendance').add({name:userName,staffId:currentUid,status:'Present',date:new Date().toDateString(),createdAt:new Date(),type:'staff'});alert('You marked Present');listMyAttendance()}
async function listMyAttendance(){let s=await db.collection('attendance').where('staffId','==',currentUid).orderBy('createdAt','desc').limit(10).get();let h='';s.forEach(d=>{h+=`<div class="card">${d.data().date} - ${d.data().status}</div>`});document.getElementById('listBox').innerHTML=h||'No staff attendance yet'}

// --- TAHFIIZU ---
async function openTahfiizuForm(id){let s=allStudents.find(x=>x.id===id);document.getElementById('tahForm').innerHTML=`<div class="card"><b>${s.name}</b><h4>Darsu (New Lesson)</h4><input id="t-darsu-from" placeholder="From Surah:Ayah e.g. Al-Fatiha:1"><input id="t-darsu-to" placeholder="To Surah:Ayah"><input id="t-darsu-pages" type="number" placeholder="Pages"><h4>Darsu-Sitta (Revision 6 Lessons)</h4><input id="t-sitta-from" placeholder="From"><input id="t-sitta-to" placeholder="To"><input id="t-sitta-pages" type="number" placeholder="Pages"><h4>Omuraaji'a (General Revision)</h4><input id="t-om-from" placeholder="From"><input id="t-om-to" placeholder="To"><input id="t-om-pages" type="number" placeholder="Pages"><button class="btn btn-green" onclick="saveTahfiizuRec('${id}')">Save Presentation</button></div>`}
async function saveTahfiizuRec(id){let s=allStudents.find(x=>x.id===id);await db.collection('tahfiizu').add({studentId:id,name:s.name,darsu:document.getElementById('t-darsu-from').value+' → '+document.getElementById('t-darsu-to').value,darsuPages:Number(document.getElementById('t-darsu-pages').value||0),sitta:document.getElementById('t-sitta-from').value+' → '+document.getElementById('t-sitta-to').value,sittaPages:Number(document.getElementById('t-sitta-pages').value||0),omura:document.getElementById('t-om-from').value+' → '+document.getElementById('t-om-to').value,omuraPages:Number(document.getElementById('t-om-pages').value||0),date:new Date().toDateString(),createdAt:new Date(),by:userName});alert('Tahfiizu Saved');}
async function listTahfiizuStudents(){let list=allStudents.filter(s=>s.isTahfiizu);document.getElementById('listBox').innerHTML=list.map(s=>`<div class="card">${s.name} - ${s.cls} - ID ${s.studentId}</div>`).join('')||'No Tahfiizu students'}

// --- MARKS / REPORT / PERFORMANCE ---
async function openMarksForm(id){let s=allStudents.find(x=>x.id===id);let subs=cur==='teacher_theo'?appSettings.subjectsTheo:appSettings.subjectsSec;document.getElementById('marksBox').innerHTML=`<div class="card"><b>${s.name} - ${s.cls}</b>${subs.map(sub=>`<input id="mark-${sub}" type="number" placeholder="${sub} /100">`).join('')}<button class="btn btn-green" onclick="saveMarks('${id}')">Save Marks</button></div>`}
async function saveMarks(id){let s=allStudents.find(x=>x.id===id);let subs=cur==='teacher_theo'?appSettings.subjectsTheo:appSettings.subjectsSec;let marks={};let total=0;subs.forEach(sub=>{let v=Number(document.getElementById('mark-'+sub).value||0);marks[sub]=v;total+=v});await db.collection('results').add({studentId:id,name:s.name,cls:s.cls,marks,total,by:userName,createdAt:new Date(),side:cur==='teacher_theo'?'theo':'sec'});alert('Saved Total '+total)}
async function genReportCard(id){let s=allStudents.find(x=>x.id===id);let snap=await db.collection('results').where('studentId','==',id).orderBy('createdAt','desc').limit(5).get();let h='';snap.forEach(d=>{let m=d.data().marks||{};h+=`<div>${d.data().side||''} - Total ${d.data().total} - ${Object.entries(m).map(([k,v])=>k+': '+v).join(', ')}</div>`});let allInClass=allStudents.filter(x=>x.cls===s.cls);document.getElementById('reportBox').innerHTML=`<div class="card printArea"><h2 style="text-align:center">SALAAMA - REPORT CARD</h2><b>${s.name} - ${s.cls} - ID ${s.studentId}</b><br>Fees: ${s.fees} Paid: ${s.paid} Bal: ${(s.fees||0)-(s.paid||0)}<br><h3>Secular + Theology on One Sheet</h3>${h||'No marks yet'}<button class="btn" onclick="window.print()">Print A4</button></div>`}
async function listPerformance(){let r=await db.collection('results').orderBy('createdAt','desc').limit(30).get();let h='';r.forEach(d=>{if(d.data()._init)return;h+=`<div class="card">${d.data().name} - ${d.data().cls} - Total ${d.data().total}</div>`});document.getElementById('listBox').innerHTML=h||'No results';}
async function listResultsView(){listPerformance()}
async function loadTeacherPerfUsers(){let u=await db.collection('users').get();let h='<option value="">Select Teacher</option>';u.forEach(d=>{if(!d.data()._init)h+=`<option value="${d.id}">${d.data().name} - ${(d.data().approvedRoles||[]).join(',')}</option>`});document.getElementById('tp-user').innerHTML=h}
async function saveTeacherPerf(){let uid=document.getElementById('tp-user').value;if(!uid){alert('Select teacher');return}await db.collection('results').add({type:'teacherPerf',teacherId:uid,marks:Number(document.getElementById('tp-marks').value||0),desc:document.getElementById('tp-desc').value,createdAt:new Date(),by:userName});alert('Teacher Performance Saved')}
async function listTeacherMgmt(){let u=await db.collection('users').where('approved','==',true).get();let h='';u.forEach(d=>{let x=d.data();if(x._init)return;h+=`<div class="card"><b>${x.name}</b><br>Roles: ${(x.approvedRoles||[]).join(', ')}<br>My Class: ${x.myClass||''} Subjects: ${(x.mySubjects||[]).join(', ')}<br>Other: ${(x.otherClasses||[]).join(', ')} Salary: ${x.salary||0}</div>`});document.getElementById('listBox').innerHTML=h}
async function listMyClass(){let doc=await db.collection('users').doc(currentUid).get();let my=doc.data()||{};let list=allStudents.filter(s=>s.cls===my.myClass);document.getElementById('listBox').innerHTML=`<h3>My Class: ${my.myClass||'Not assigned'}</h3>`+list.map(s=>`<div class="card">${s.name} - ID ${s.studentId}</div>`).join('')||'No students'}
async function listOtherClasses(){let doc=await db.collection('users').doc(currentUid).get();let my=doc.data()||{};let h='';(my.otherClasses||[]).forEach(cls=>{let list=allStudents.filter(s=>s.cls===cls);h+=`<div class="card"><b>${cls} - Subjects: ${(my.otherSubjects||[]).join(', ')}</b><br>${list.map(s=>s.name).join(', ')||'No students'}</div>`});document.getElementById('listBox').innerHTML=h||'No other classes'}
async function listMySubjects(){let doc=await db.collection('users').doc(currentUid).get();let my=doc.data()||{};document.getElementById('listBox').innerHTML=`<div class="card"><b>My Class Subjects:</b> ${(my.mySubjects||[]).join(', ')}<br><b>Other Classes Subjects:</b> ${(my.otherSubjects||[]).join(', ')}</div>`}

// --- DOCS / MESSAGES / MEDIA / TIMETABLE / EXAMS / CURRICULUM / HISTORY / SETTINGS ---
async function saveDocument(){let name=document.getElementById('doc-name').value;let text=document.getElementById('doc-text').value;let fmt=document.getElementById('doc-format').value;if(fmt==='PNG'&&!appSettings.allowPNG){alert('PNG not allowed in Settings');return}if(fmt==='PDF'&&!appSettings.allowPDF){alert('PDF not allowed');return}if(fmt==='DOCX'&&!appSettings.allowDOCX){alert('DOCX not allowed');return}if(!name){alert('Name document');return}await db.collection('documents').add({name,text,format:fmt,ownerId:currentUid,ownerName:userName,sharedTo:[],createdAt:new Date()});alert('Document Saved');listDocuments()}
async function listDocuments(){let s=await db.collection('documents').where('ownerId','==',currentUid).orderBy('createdAt','desc').limit(30).get();let h='';s.forEach(d=>{if(d.data()._init)return;h+=`<div class="card"><b>${d.data().name}</b> - ${d.data().format}<br>${(d.data().text||'').slice(0,100)}<br><select id="share-${d.id}"><option>Share to user...</option></select><button onclick="shareDoc('${d.id}')">Send</button></div>`});let s2=await db.collection('documents').where('sharedTo','array-contains',currentUid).get();s2.forEach(d=>{h+=`<div class="card" style="border-color:#2E9E4F"><b>Received: ${d.data().name}</b> from ${d.data().ownerName}</div>`});document.getElementById('listBox').innerHTML=h||'No documents';let users=await db.collection('users').get();document.querySelectorAll('[id^="share-"]').forEach(sel=>{users.forEach(u=>{if(!u.data()._init)sel.innerHTML+=`<option value="${u.id}">${u.data().name}</option>`})})}
async function shareDoc(docId){let sel=document.getElementById('share-'+docId);let to=sel.value;if(!to||to.includes('Share')){alert('Select user');return}await db.collection('documents').doc(docId).update({sharedTo:firebase.firestore.FieldValue.arrayUnion(to)});alert('Sent')}
async function loadMessageUsers(){let u=await db.collection('users').get();let h='<option value="">Select user...</option>';u.forEach(d=>{if(!d.data()._init)h+=`<option value="${d.id}">${d.data().name} - ${(d.data().approvedRoles||[]).join(',')}</option>`});document.getElementById('msg-to').innerHTML=h}
async function sendMessage(){let to=document.getElementById('msg-to').value;let text=document.getElementById('msg-text').value;if(!to||!text){alert('Select user + type');return}await db.collection('messages').add({fromId:currentUid,fromName:userName,toId:to,text,createdAt:new Date()});alert('Sent');listMessages()}
async function listMessages(){let s=await db.collection('messages').where('toId','==',currentUid).orderBy('createdAt','desc').limit(20).get();let h='';s.forEach(d=>{if(d.data()._init)return;h+=`<div class="card"><b>From ${d.data().fromName}</b><br>${d.data().text}</div>`});document.getElementById('listBox').innerHTML=h||'No messages'}
async function saveMedia(){if(!(isAdminUser||isDeveloper)){alert('Admin only can upload');return}let f=document.getElementById('media-file').files[0];if(!f){alert('Select file');return}await db.collection('documents').add({name:f.name,type:'media',ownerId:currentUid,ownerName:userName,createdAt:new Date()});alert('Media saved (name only - use Firebase Storage for real file in next step)');listMedia()}
async function listMedia(){let s=await db.collection('documents').where('type','==','media').orderBy('createdAt','desc').limit(20).get();let h='';s.forEach(d=>{h+=`<div class="card">🎬 ${d.data().name} - By ${d.data().ownerName}<br><button class="btn" onclick="alert('Play - Connect Storage for real video')">Play</button></div>`});document.getElementById('listBox').innerHTML=h||'No media yet'}
async function saveTimetable(){await db.collection('timetables').add({day:document.getElementById('tt-day').value,time:document.getElementById('tt-time').value,subject:document.getElementById('tt-subject').value,cls:document.getElementById('tt-class').value,by:userName,createdAt:new Date()});alert('Timetable Saved');listTimetables()}
async function listTimetables(){let s=await db.collection('timetables').orderBy('createdAt','desc').limit(20).get();let h='';s.forEach(d=>{if(d.data()._init)return;h+=`<div class="card">${d.data().day} ${d.data().time} - ${d.data().subject} - Class ${d.data().cls}</div>`});document.getElementById('listBox').innerHTML=h||'No timetable'}
async function saveLessonPlan(){await db.collection('curriculum').add({type:'lesson',cls:document.getElementById('lp-class').value,subject:document.getElementById('lp-subject').value,text:document.getElementById('lp-text').value,by:userName,createdAt:new Date()});alert('Lesson Plan Saved');listLessonPlans()}
async function listLessonPlans(){let s=await db.collection('curriculum').where('type','==','lesson').orderBy('createdAt','desc').limit(20).get();let h='';s.forEach(d=>{h+=`<div class="card">${d.data().cls} - ${d.data().subject}<br>${d.data().text}</div>`});document.getElementById('listBox').innerHTML=h||'No lesson plans'}
async function saveExam(){await db.collection('exams').add({cls:document.getElementById('ex-class').value,subject:document.getElementById('ex-subject').value,text:document.getElementById('ex-text').value,by:userName,status:'pending',createdAt:new Date()});alert('Submitted for Approval');listExams()}
async function listExams(){let s=await db.collection('exams').where('by','==',userName).orderBy('createdAt','desc').limit(20).get();let h='';s.forEach(d=>{h+=`<div class="card">${d.data().cls} - ${d.data().subject} - ${d.data().status}<br>${d.data().text}</div>`});document.getElementById('listBox').innerHTML=h||'No exams'}
async function listExamsApproval(){let s=await db.collection('exams').where('status','==','pending').get();let h='';s.forEach(d=>{h+=`<div class="card">${d.data().cls} - ${d.data().subject} by ${d.data().by}<br>${d.data().text}<br><button class="btn btn-green" onclick="approveExam('${d.id}')">Approve</button><button class="btn btn-red" onclick="rejectExam('${d.id}')">Reject</button></div>`});document.getElementById('listBox').innerHTML=h||'No pending exams'}
async function approveExam(id){await db.collection('exams').doc(id).update({status:'approved'});alert('Approved');listExamsApproval()}
async function rejectExam(id){await db.collection('exams').doc(id).update({status:'rejected'});alert('Rejected');listExamsApproval()}
async function saveCurriculum(side){await db.collection('curriculum').add({type:'curriculum',side,text:document.getElementById('curr-text').value,by:userName,createdAt:new Date()});alert('Curriculum Saved');listCurriculum(side)}
async function listCurriculum(side){let s=await db.collection('curriculum').where('side','==',side).orderBy('createdAt','desc').limit(10).get();let h='';s.forEach(d=>{h+=`<div class="card">${d.data().text}</div>`});document.getElementById('listBox').innerHTML=h||'No curriculum'}
async function listHistory(){let s=await db.collection('history').orderBy('createdAt','desc').limit(10).get();let h='';s.forEach(d=>{h+=`<div class="card">${d.data().term||''} - ${d.data().count||0} students - ${d.data().date||''}</div>`});document.getElementById('listBox').innerHTML=h||'No history yet'}
async function listMyChildrenDetail(title){let my=allStudents.filter(s=>(s.parentIds||[]).includes(currentUid));if(title==='My Child Profile')document.getElementById('listBox').innerHTML=my.map(s=>`<div class="card"><b>${s.name}</b> - ${s.cls} - ID ${s.studentId}<br>Father ${s.fatherName} Mother ${s.motherName}</div>`).join('')||'No children. Enter Child ID in Students Management → Link Parent';if(title==='Fees Status')document.getElementById('listBox').innerHTML=my.map(s=>`<div class="card">${s.name} - Fees ${s.fees} Paid ${s.paid} Bal ${(s.fees||0)-(s.paid||0)} Admission ${s.admissionFee||0}</div>`).join('')||'No children';if(title==='Tahfiizu Progress'){let tah=my.filter(s=>s.isTahfiizu);document.getElementById('listBox').innerHTML=tah.map(s=>`<div class="card">${s.name} - Tahfiizu Student</div>`).join('')||'Not Tahfiizu'}}
// SETTINGS SAVE
async function saveAllSettings(){appSettings.allowDeleteStudents=document.getElementById('p-delStu').checked;appSettings.allowDeleteTeachers=document.getElementById('p-delStaff').checked;appSettings.allowPNG=document.getElementById('p-png').checked;appSettings.allowPDF=document.getElementById('p-pdf').checked;appSettings.allowDOCX=document.getElementById('p-docx').checked;appSettings.allowTheologySettings=document.getElementById('p-theoSet').checked;await saveSettingsDoc();alert('Settings Saved')}
async function saveTerm(){let nb=document.getElementById('termBegin').value;let ne=document.getElementById('termEnd').value;if(appSettings.termBegin&&appSettings.termBegin!==nb){await db.collection('history').add({term:appSettings.termBegin+' to '+appSettings.termEnd,count:allStudents.length,date:new Date().toDateString(),createdAt:new Date()})}appSettings.termBegin=nb;appSettings.termEnd=ne;await saveSettingsDoc();alert('Term Saved - Old term moved to History')}
async function saveTheoSettings(){if(!appSettings.allowTheologySettings){alert('Admin must Allow Theology Settings first');return}appSettings.allowCustomTheology=document.getElementById('set-customTheo').checked;appSettings.allowBothDates=document.getElementById('set-bothDates').checked;appSettings.allowEngArabic=document.getElementById('set-engArab').checked;await saveSettingsDoc();alert('Theo Settings Saved')}
async function addFeeType(){let n=document.getElementById('newFeeName').value;let a=Number(document.getElementById('newFeeAmt').value||0);if(!n)return;appSettings.feesTypes.push({name:n,amount:a});await saveSettingsDoc();openScreen('Settings')}
async function delFeeType(i){appSettings.feesTypes.splice(i,1);await saveSettingsDoc();openScreen('Settings')}
async function addRequirement(){let n=document.getElementById('newReqName').value;let q=document.getElementById('newReqQty').value;let a=document.getElementById('newReqAmt').value;if(!n)return;appSettings.requirements.push({name:n,qty:q,amount:a});await saveSettingsDoc();openScreen('Settings')}
async function delReq(i){appSettings.requirements.splice(i,1);await saveSettingsDoc();openScreen('Settings')}
async function addSubSec(){let v=document.getElementById('newSubSec').value;if(!v)return;appSettings.subjectsSec.push(v);await saveSettingsDoc();openScreen('Settings')}
async function addSubTheo(){let v=document.getElementById('newSubTheo').value;if(!v)return;appSettings.subjectsTheo.push(v);await saveSettingsDoc();openScreen('Settings')}
</script></body></html>
